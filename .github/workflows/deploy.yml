name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA on main to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate SHA
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha must be a full 40-character lowercase commit SHA" >&2
            exit 1
          fi
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}
      - name: Deploy over Tailscale SSH
        env:
          SHA: ${{ inputs.sha }}
        run: tailscale ssh "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" "REGISTRY=ghcr.io/${{ github.repository_owner }} /srv/gymos/deploy/k8s/deploy.sh $SHA"
