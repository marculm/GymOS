name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gymos
          POSTGRES_PASSWORD: gymos
          POSTGRES_DB: gymos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymos -d gymos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gymos:gymos@localhost:5432/gymos?schema=public
      GYMOS_USER_EMAIL: demo@gymos.app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun --filter @gymos/api db:generate
      - run: bun --filter @gymos/api db:migrate:deploy
      - run: bun --filter @gymos/api db:seed
      - run: bun run typecheck
      - run: bun run lint:all
      - run: bun run test
      - run: bun run build

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflow
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
      - name: Validate manifests
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/yannh/kubeconform:latest -strict -summary deploy/k8s/*.yaml
      - name: Lint deploy script
        run: docker run --rm -v "$PWD:/repo" -w /repo koalaman/shellcheck:stable deploy/k8s/deploy.sh

  images:
    needs: [checks, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: gymos-api
            dockerfile: apps/api/Dockerfile
            target: runtime
          - image: gymos-web
            dockerfile: apps/web/Dockerfile
            target: runtime
          - image: gymos-api-migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
