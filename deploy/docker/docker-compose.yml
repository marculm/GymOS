services:
  postgres:
    image: postgres:17-alpine
    container_name: gymos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - gymos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: migrate
    command:
      - sh
      - -c
      - bun --filter @gymos/api db:migrate:deploy && bun --filter @gymos/api db:seed
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      GYMOS_USER_EMAIL: ${GYMOS_USER_EMAIL:-demo@gymos.app}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      GYMOS_USER_EMAIL: ${GYMOS_USER_EMAIL:-demo@gymos.app}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  gymos_postgres_data:
