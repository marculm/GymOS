apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gymos
  namespace: gymos
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          # /prometheus intentionally falls through to the web app, not the metrics.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
