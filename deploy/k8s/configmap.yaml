apiVersion: v1
kind: ConfigMap
metadata:
  name: gymos-config
  namespace: gymos
data:
  NODE_ENV: production
  PORT: "3000"
  GYMOS_USER_EMAIL: demo@gymos.app
  LOG_LEVEL: info
  POSTGRES_USER: gymos
  POSTGRES_DB: gymos
  # Web push is optional. Generate keys with `bunx web-push generate-vapid-keys`,
  # then set the public key here and the private key in the gymos-secrets Secret.
  # VAPID_PUBLIC_KEY: <public key>
  # VAPID_SUBJECT: mailto:you@example.com
