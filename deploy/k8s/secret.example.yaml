# Example only: copy, replace the placeholders, and apply the copy.
apiVersion: v1
kind: Secret
metadata:
  name: gymos-secrets
  namespace: gymos
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-with-a-strong-password
  DATABASE_URL: postgresql://gymos:replace-with-a-strong-password@postgres:5432/gymos?schema=public
  # Optional web push private key; add the public key to gymos-config.
  # VAPID_PRIVATE_KEY: <private key>
